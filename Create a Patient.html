<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Studio (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============ DESIGN TOKENS: same palette as the Encounter screen ============ */
  :root {
    --bg: #E9EEEF; --surface: #FFFFFF; --ink: #14282D; --muted: #5B6F74; --line: #CBD6D8;
    --primary: #0E5A62; --primary-ink: #FFFFFF;
    --marker: #F4C542; --marker-soft: #FFF6D6;
    --alert: #A8362E; --alert-soft: #FBEAE8;
    --ok: #1F6B3A; --ok-soft: #E4F3E9;
    --radius: 10px;
    --font: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--marker); outline-offset: 2px; }

  header.top { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
  header.top h1 { margin: 0; font-size: 18px; }
  header.top span { color: var(--muted); }

  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 16px; padding: 16px 20px 40px; align-items: start; }

  /* ---- Sidebar ---- */
  aside { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; position: sticky; top: 16px; }
  aside h2 { font-size: 15px; margin: 0 0 10px; }
  .plist { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .pbtn { width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: block; }
  .pbtn[aria-current="true"] { border-color: var(--primary); box-shadow: inset 4px 0 0 var(--primary); }
  .pbtn b { display: block; font-weight: 600; }
  .pbtn small { color: var(--muted); }

  /* ---- Buttons ---- */
  .btn { border: 1px solid var(--primary); background: var(--primary); color: var(--primary-ink); padding: 8px 14px; border-radius: 8px; font-weight: 600; }
  .btn.ghost { background: #fff; color: var(--primary); }
  .btn.danger { background: #fff; color: var(--alert); border-color: var(--alert); }
  .btn.small { padding: 4px 10px; font-size: 14px; }
  .btn.block { width: 100%; }

  /* ---- Editor ---- */
  .bar { position: sticky; top: 0; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
         padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .bar .title { font-weight: 700; font-size: 16px; margin-right: auto; }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); }
  .pill.pub { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
  .pill.draft { background: var(--marker-soft); border-color: var(--marker); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
  .card > h2 { margin: 0 0 4px; font-size: 17px; }
  .card > .hint { margin: 0 0 14px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
  label.f { display: block; }
  label.f > span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  textarea { resize: vertical; }
  .sub { border: 1px solid var(--line); border-left: 4px solid var(--primary); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; display: grid; gap: 10px; }
  .sub .row-end { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .check { display: flex; align-items: center; gap: 8px; }
  .check input { width: 18px; height: 18px; }
  .objrow { display: flex; gap: 8px; margin-bottom: 8px; }
  .filename { color: var(--muted); font-size: 14px; }

  /* ---- Results ---- */
  .results { margin-bottom: 14px; }
  .res { border-radius: var(--radius); padding: 14px 18px; border: 1px solid var(--line); background: var(--surface); }
  .res h3 { margin: 0 0 6px; font-size: 15px; }
  .res ul { margin: 0 0 8px; padding-left: 20px; }
  .res.bad { border-color: var(--alert); background: var(--alert-soft); }
  .res.good { border-color: var(--ok); background: var(--ok-soft); }
  .res .must { color: var(--alert); font-weight: 700; }
  .res .warn { font-weight: 700; }
  .res .info-label { color: var(--muted); font-weight: 700; }

  /* ---- AI extraction ---- */
  .ai-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .btn.ai { background: #6B3FA0; border-color: #6B3FA0; }
  .btn.ai:disabled { opacity: .6; cursor: default; }
  .ai-status { color: var(--muted); font-size: 14px; }
  .ai-status.err { color: var(--alert); font-weight: 600; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--primary);
             border-radius: 50%; display: inline-block; vertical-align: -3px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ai-badge { display: inline-block; background: var(--marker-soft); border: 1px solid var(--marker);
              color: #6b5300; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; margin-left: 6px; }
  .preview { margin-top: 14px; border: 1px solid #6B3FA0; border-radius: var(--radius); background: #F7F3FC; padding: 14px 16px; }
  .preview h3 { margin: 0 0 8px; font-size: 15px; }
  .preview .pv-sec { margin: 0 0 10px; }
  .preview .pv-sec b { display: block; margin-bottom: 2px; }
  .preview ul { margin: 4px 0 0; padding-left: 20px; }
  .preview .conflict { color: var(--alert); font-weight: 600; }
  .preview .missing { background: var(--marker-soft); border: 1px solid var(--marker); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
  .preview .pv-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

  /* ---- Preset picker modal ---- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(20,40,45,.45); display: flex;
                   align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow: auto; }
  .modal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
           width: 100%; max-width: 720px; padding: 18px 20px; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .modal-head h3 { margin: 0; font-size: 17px; }
  .modal input[type=text] { margin: 4px 0 12px; }
  .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .preset-card { border: 1px solid var(--line); border-left: 4px solid var(--primary); border-radius: 8px;
                 padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .preset-card b { font-size: 15px; }
  .preset-meta { color: var(--muted); font-size: 13px; font-weight: 600; }
  .preset-sum { margin: 0; font-size: 13px; color: var(--ink); }
  .preset-card .btn { align-self: flex-start; margin-top: 2px; }
  @media (max-width: 640px) { .preset-grid { grid-template-columns: 1fr; } }

  /* ---- Subsections inside a top-level card ---- */
  .subsection { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 16px; }
  .subsection:first-of-type { border-top: 0; margin-top: 6px; padding-top: 0; }
  .subsection > h3 { margin: 0 0 4px; font-size: 15px; }
  .subsection > .hint { margin: 0 0 12px; color: var(--muted); }

  /* ---- Year rubric panel ---- */
  .rubric { border: 1px solid var(--line); border-radius: var(--radius); background: #f6f9f9; padding: 14px 16px; margin-top: 10px; }
  .rubric h4 { margin: 0 0 8px; font-size: 14px; }
  .rubric .exp { margin: 0 0 12px; padding-left: 18px; }
  .rubric table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .rubric th, .rubric td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .rubric th { color: var(--muted); font-size: 13px; }
  .mode { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid var(--line); }
  .mode.core { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
  .mode.lenient { background: var(--marker-soft); border-color: var(--marker); color: #6b5300; }
  .mode.na { background: #eef1f1; color: var(--muted); }
  .rubric .epa { margin: 10px 0 0; padding-left: 18px; }
  .rubric .reviewnote { margin-top: 10px; font-size: 13px; color: var(--alert); }
  .rubric .scalekey { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .rubric .scalekey span { white-space: nowrap; }
  .official-badge { display: inline-block; background: #e2ecf0; border: 1px solid var(--primary); color: var(--primary);
                    font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; margin-left: 6px; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; }
    .grid2, .grid3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="top">
  <h1>Patient Studio</h1>
  <span>Prototype for faculty</span>
</header>

<div class="layout">
  <aside aria-label="Patient library">
    <h2>Your patients</h2>
    <ul class="plist" id="plist"></ul>
    <button class="btn block" id="newBtn" type="button">New patient</button>
  </aside>

  <main id="editor"></main>
</div>

<script>
/* =====================================================================
   PATIENT STUDIO  —  contents of this script
   ---------------------------------------------------------------------
    1. Config               — AI endpoint
    2. Data model           — constants + blank/sample patient + helpers
    3. Student profile       — profile & assessment-criteria config/helpers
    4. Year rubric config    — general M1–M4 rubric (single source of truth)
    5. Pediatrics rubric      — informational Pediatrics rubric config/helper
    6. Storage               — load/save to localStorage
    7. DOM & field helpers    — h() hyperscript + input builders
    8. Consistency checks     — runChecks + results panel
    9. Export & publish       — toEncounterProfile, download, publish
   10. AI extraction          — fetch, preview, apply
   11. Rendering             — sidebar, rubric panels, editor
   12. Bootstrap             — load() + first render
   ===================================================================== */

/* =====================================================================
   1. CONFIG
   The AI call runs on a small LOCAL server (see scripts/studio_server.py in
   the Twinverse_HealthHack project), never in this page, so AWS keys stay out
   of the browser. This is just the URL of that local server's /extract route.
   ===================================================================== */
const AI_ENDPOINT = "http://127.0.0.1:8000/extract";

/* =====================================================================
   1b. PRESET PATIENT LIBRARY  (built-in case library)
   Preset cases prepared from the synthetic, CC BY 4.0 dataset
   "joeljames270/virtual-patient-profiles-sample" (VHS project, Rutgers).
   The records are embedded below as version-controlled data so they load
   instantly with no network request, no API keys, and no extra dependencies.
   Only fields that exist in the source are used; nothing is invented.
   ===================================================================== */
const PRESET_DATA = {"source": {"dataset": "joeljames270/virtual-patient-profiles-sample", "url": "https://huggingface.co/datasets/joeljames270/virtual-patient-profiles-sample", "license": "CC BY 4.0", "synthetic": true, "attribution": "VHS (Virtual Human Simulation) project, Rutgers University"}, "patients": [{"sourceRecordId": 0, "name": "Dominic Rivera", "age": 22, "sex": "Male", "category": "young adult male", "summary": "A 22-year-old Puerto Rican male college student recovering from a gunshot wound trauma. He is a community volunteer and feels protective over his younger siblings. He has a history of Type 2 Diabetes (prediabetic history) but is now poorly controlled. He is skeptical of healthcare systems and authority figures, showing resistance to standard medical advice. He has limited health literacy and low motivation to adhere to strict dietary or medication regimens. He values his role in the community and is protective of his family, which can be a lever for motivation but also a source of stress.", "keywords": ["young adult male", "poorly controlled type 2 diabetes", "healthcare mistrust", "cultural humility", "nutrition education", "resilient", "community volunteer", "low adherence", "health literacy", "trauma recovery"], "caseText": "A 22-year-old Puerto Rican male college student recovering from a gunshot wound trauma. He is a community volunteer and feels protective over his younger siblings. He has a history of Type 2 Diabetes (prediabetic history) but is now poorly controlled. He is skeptical of healthcare systems and authority figures, showing resistance to standard medical advice. He has limited health literacy and low motivation to adhere to strict dietary or medication regimens. He values his role in the community and is protective of his family, which can be a lever for motivation but also a source of stress.\n\nPrimary diagnosis: Poorly controlled Type 2 Diabetes Mellitus\n\nSecondary diagnoses:\n- History of prediabetes (2 years)\n- Recent gunshot wound (recovering, 2 months ago)\n- Mild trauma-related stress\n\nPast medical history:\n- Family history of Type 2 Diabetes (mother)\n- Recent emergency surgery for gunshot wound\n- History of weight fluctuation\n\nCurrent symptoms:\n- Frequent thirst and urination\n- Fatigue and low energy\n- Occasional cravings for sweet foods\n- Mild headache and blurred vision occasionally\n\nVital signs:\n- BP: 128/82 mmHg\n- HR: 78 bpm\n- Temp: 98.6°F\n- Respiratory Rate: 16 bpm\n\nAnthropometrics:\n- Height: 5'9\"\n- Weight: 178 lbs\n- BMI: 27.8 (Overweight)\n- Recent weight gain: 5 lbs over 3 months\n\nMedications:\n- Metformin 500 mg 1 dose daily — Improve insulin sensitivity and lower blood glucose\n- Lisinopril 10 mg 1 dose daily — Manage blood pressure\n\nAllergies:\n- No known allergies\n\nLaboratory data:\n- HbA1c: 9.8%\n- Fasting Glucose: 180 mg/dL\n- Total Cholesterol: 220 mg/dL", "artifacts": [{"name": "HbA1c", "type": "Lab report", "finding": "HbA1c: 9.8%", "abnormal": false}, {"name": "Fasting Glucose", "type": "Lab report", "finding": "Fasting Glucose: 180 mg/dL", "abnormal": false}, {"name": "Total Cholesterol", "type": "Lab report", "finding": "Total Cholesterol: 220 mg/dL", "abnormal": false}], "temperament": {"temperament": "Custom", "temperamentCustom": "Resilient and pragmatic, but skeptical of authority. He values independence and self-reliance, but feels frustrated by limitations imposed by his diagnosis and recovery. He is protective of his younger siblings and sees them as his motivation to be healthy, though he masks this vulnerability.", "commStyle": "Custom", "commStyleCustom": "Direct and occasionally blunt. He uses slang and may interrupt if he feels unheard. He prefers Spanish and may switch to English if the topic becomes clinical. He shows defensiveness when criticized but opens up when he feels respected.", "cues": "", "triggers": "Fear of losing his job as a volunteer; Concern about side effects of medication; Fear of becoming a burden to his family; Dependency on family; Further health complications; Returning to hospital", "empathyResponse": "Ambivalent; willing to try small changes but needs to see immediate benefits and feel trusted by his care team.", "progression": "", "notes": "Barriers: Limited health literacy; Inconsistent work hours; Food deserts in his neighborhood; Mistrust of medical advice; Stress and trauma symptoms\nSupport system: Younger siblings and parents; neighbors who support him in community service"}}, {"sourceRecordId": 1, "name": "Yvette Armstrong", "age": 64, "sex": "Female", "category": "hypertension", "summary": "A 64-year-old Eastern European American woman recently diagnosed with Stage II hypertension and uncontrolled type 2 diabetes. Works full-time as a state employee with an associate's degree in political science. Curious and earnest but feels overwhelmed by complex medical information. Reports confusion about the difference between sodium and salt, struggles to understand the pathophysiology of her conditions, and expresses frustration about the difficulty of making dietary changes. BMI is 34 with a history of hypertension and type 2 diabetes. She is motivated to improve her health but faces barriers related to health literacy, financial constraints, limited time for cooking, and emotional stress from balancing full-time work with growing family responsibilities.", "keywords": ["hypertension", "type_2_diabetes", "health_literacy", "medication_management", "motivational_interviewing", "sodium_restriction", "weight_loss", "dietary_education", "patient_interview", "psychosocial_barriers"], "caseText": "A 64-year-old Eastern European American woman recently diagnosed with Stage II hypertension and uncontrolled type 2 diabetes. Works full-time as a state employee with an associate's degree in political science. Curious and earnest but feels overwhelmed by complex medical information. Reports confusion about the difference between sodium and salt, struggles to understand the pathophysiology of her conditions, and expresses frustration about the difficulty of making dietary changes. BMI is 34 with a history of hypertension and type 2 diabetes. She is motivated to improve her health but faces barriers related to health literacy, financial constraints, limited time for cooking, and emotional stress from balancing full-time work with growing family responsibilities.\n\nPrimary diagnosis: Hypertension (Stage II)\n\nSecondary diagnoses:\n- Uncontrolled Type 2 Diabetes\n- Obesity\n\nPast medical history:\n- Hypertension (recently diagnosed)\n- Type 2 Diabetes (diagnosed 2 years ago, poorly controlled)\n- Occasional headaches\n- Frequent low back pain\n\nCurrent symptoms:\n- Persistent mild headaches\n- Fatigue\n- Frequent urination\n- Increased thirst\n- Swelling in ankles and feet\n- Blurred vision occasionally\n\nVital signs:\n- Temperature: 98.6°F\n- Heart Rate: 78 bpm\n- Respiratory Rate: 18 breaths/min\n- Pulse Ox: 99%\n- BP: 155/110 mmHg\n- Respiratory Status: Unlabored\n\nAnthropometrics:\n- Height: 5'2\" (157.5 cm)\n- Weight: 178 lbs (80.7 kg)\n- BMI: 34.0 kg/m2\n- Recent weight change: +8 lbs over past 6 months\n\nMedications:\n- Amlodipine 5 mg once daily — Hypertension\n- Metformin 500 mg twice daily with meals — Type 2 Diabetes\n\nAllergies:\n- Penicillin (rash)\n\nLaboratory data:\n- HbA1c: 8.5%\n- Fasting Glucose: 145 mg/dL\n- Total Cholesterol: 230 mg/dL\n- LDL: 115 mg/dL\n- Triglycerides: 190 mg/dL\n- Sodium: 138 mEq/L\n- Potassium: 4.5 mEq/L\n- BUN: 16 mg/dL\n- Creatinine: 1.1 mg/dL", "artifacts": [{"name": "HbA1c", "type": "Lab report", "finding": "HbA1c: 8.5%", "abnormal": false}, {"name": "Fasting Glucose", "type": "Lab report", "finding": "Fasting Glucose: 145 mg/dL", "abnormal": false}, {"name": "Total Cholesterol", "type": "Lab report", "finding": "Total Cholesterol: 230 mg/dL", "abnormal": false}, {"name": "LDL", "type": "Lab report", "finding": "LDL: 115 mg/dL", "abnormal": false}, {"name": "Triglycerides", "type": "Lab report", "finding": "Triglycerides: 190 mg/dL", "abnormal": false}, {"name": "Sodium", "type": "Lab report", "finding": "Sodium: 138 mEq/L", "abnormal": false}, {"name": "Potassium", "type": "Lab report", "finding": "Potassium: 4.5 mEq/L", "abnormal": false}, {"name": "BUN", "type": "Lab report", "finding": "BUN: 16 mg/dL", "abnormal": false}, {"name": "Creatinine", "type": "Lab report", "finding": "Creatinine: 1.1 mg/dL", "abnormal": false}], "temperament": {"temperament": "Custom", "temperamentCustom": "Curious, earnest, and eager to learn but easily overwhelmed by technical jargon and lengthy explanations. Values honesty and direct communication. Tries hard to comply but becomes frustrated when changes feel too difficult or unsustainable.", "commStyle": "Custom", "commStyleCustom": "Asks clarifying questions when confused. May hesitate to ask if she feels she is burdening the provider. Responds well to patient, respectful, and non-judgmental communication. Uses lay terms and needs concepts explained simply with examples.", "cues": "", "triggers": "Fear of complications from diabetes and hypertension; Worry about medication side effects; Frustration with not understanding what sodium and salt mean; Concern about cost of healthy food; Anxiety about disappointing her family; Fear of stroke or heart attack; Fear of losing independence if she gets sick; Fear of losing her job due to health issues; Fear of not being able to afford food or medical bills", "empathyResponse": "Moderately motivated (Stage of Change: Preparation) but feels overwhelmed by the scale of changes required. Responds well to small, manageable steps and clear, simple explanations. Needs validation and step-by-step guidance.", "progression": "", "notes": "Barriers: Limited health literacy and medical confusion; Financial constraints and food insecurity concerns; Time poverty due to full-time work and family duties; Cultural attachment to traditional high-sodium foods; Physical barriers /* One grading criterion. Only the name is really meaningful; the rest guide faculty. */
function blankCriterion(name) {

}
/* The assessment block: overall instructions plus a list of criteria. */
function blankAssessment() {
  return { instructions: "", criteria: [] };
}
/* Ensure a patient has a complete student profile. Older saved records may lack
   it or lack newer keys, so we fill any gaps safely (same approach as temp()). */
function studentProfile(p) {
  if (!p.studentProfile || typeof p.studentProfile !== "object") p.studentProfile = blankStudentProfile();
  else { const b = blankStudentProfile(); for (const k in b) if (!(k in p.studentProfile)) p.studentProfile[k] = b[k]; }
  // Migrate older free-text year labels to the M1-M4 keys this build uses.
  const YEAR_MIGRATE = { "Year 1": "M1", "Year 2": "M2", "Year 3": "M3", "Year 4": "M4" };
  const y = p.studentProfile.year;
  if (y && YEAR_MIGRATE[y]) p.studentProfile.year = YEAR_MIGRATE[y];
  else if (y && !YEAR_CONFIG[y]) { p.studentProfile.yearCustom = p.studentProfile.yearCustom || y; p.studentProfile.year = ""; }
  return p.studentProfile;
}
/* Ensure a patient has a complete assessment object with a criteria array.
   Learning objectives were merged into assessment criteria: a criterion's NAME
   is the thing the student should accomplish, and the extra fields say how it is
   graded. This also migrates any older record that still has a separate
   `objectives` list by folding those objectives in as criteria (name = text),
   then clearing the old list so there is a single source of truth. */
function assessment(p) {
  if (!p.assessment || typeof p.assessment !== "object") p.assessment = blankAssessment();
  if (!Array.isArray(p.assessment.criteria)) p.assessment.criteria = [];
  if (typeof p.assessment.instructions !== "string") p.assessment.instructions = "";
  // Backfill any missing keys on each criterion.
  p.assessment.criteria = p.assessment.criteria.map(c => {
    const b = blankCriterion(); const out = { ...b, ...c };
    if (!out.id) out.id = uid();
    return out;
  });
  // One-time migration of a legacy objectives list into criteria.
  if (Array.isArray(p.objectives)) {
    const existingNames = new Set(p.assessment.criteria.map(c => (c.name || "").trim().toLowerCase()).filter(Boolean));
    p.objectives.forEach(o => {
      const text = (o || "").trim();
      if (text && !existingNames.has(text.toLowerCase())) {
        p.assessment.criteria.push(blankCriterion(text));
        existingNames.add(text.toLowerCase());
      }
    });
    delete p.objectives;   // objectives now live entirely inside assessment criteria
  }
  return p.assessment;
}

/* Release words used to drive progressive disclosure in the Encounter screen.
   Faculty no longer type these; we derive them from the fact label / artifact
   name (plus any the fact already carries, e.g. from AI extraction or older
   records). Short filler words are dropped so disclosure stays meaningful. */
const TRIGGER_STOPWORDS = new Set(["the","a","an","and","or","of","to","in","on","for","with","is","are","was","were","his","her","their","patient","no","not"]);
function deriveTriggers(label, existing) {
  const words = String(label || "")
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, " ")
    .split(/\s+/)
    .filter(w => w.length > 2 && !TRIGGER_STOPWORDS.has(w));
  const merged = new Set([...(Array.isArray(existing) ? existing : []), ...words]);
  return [...merged].filter(Boolean);
}

function save() { try { localStorage.setItem("twinverse.studio", JSON.stringify(db)); } catch (e) { /* storage unavailable: keep working in memory */ } }
function load() {
  try { const raw = localStorage.getItem("twinverse.studio"); if (raw) db = JSON.parse(raw); } catch (e) { /* ignore */ }
  if (!db.patients || !db.patients.length) { const s = samplePatient(); db = { patients: [s], currentId: s.id }; }

/* =====================================================================
   7. DOM & FIELD HELPERS
   h() is a tiny hyperscript helper; the rest build reusable form controls
   (text, textarea, select, checkbox, file attach) and the editing "touch"
   bookkeeping that marks a patient dirty and re-saves.
   ===================================================================== */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else if (k === "checked") e.checked = v;
    else e.setAttribute(k, v);
  });
  kids.flat().forEach(c => { if (c !== null && c !== undefined && c !== false) e.append(c); });
  return e;
}

/* -- Editing bookkeeping: touch() marks dirty + re-renders; field builders below -- */

   Stores the chosen file's name on obj[key]. */
function fileAttach(obj, key, ariaLabel) {
  const text = () => obj[key] ? "Attached: " + obj[key] : "No file attached";
  const label = h("span", { class: "filename" }, text());

function textArea(obj, key, rows) {

/* =====================================================================
   8. CONSISTENCY CHECKS
   Rule-based stand-in. The real system adds an LLM pass that cross-checks
   history, medications, labs and artifacts for contradictions.
   ===================================================================== */
function runChecks(p) {
  const errors = [], warnings = [], info = [];
  // --- Blocking errors: the minimum a case genuinely needs to run. ---
  if (!p.name.trim()) errors.push("Add the patient's name.");
  if (!String(p.age).trim()) errors.push("Add the patient's age.");
  // Assessment criteria are OPTIONAL: a case may be published with none.
  if (!p.facts.length) errors.push("Add clinical facts for the student to discover.");

  p.facts.forEach((f, i) => {
    const n = f.label.trim() || ("Fact " + (i + 1));
    if (!f.label.trim() || !f.value.trim()) errors.push(`"${n}" needs both a label and a value.`);
    // Release words are auto-derived from the label, so this is only a warning.
    if (f.label.trim() && !deriveTriggers(f.label, f.triggers).length)
      warnings.push(`"${n}" has no usable release words from its label; students may not be able to unlock it. Try a more descriptive label.`);
  });
  p.artifacts.forEach((a, i) => {
    const n = a.name.trim() || ("Artifact " + (i + 1));
    if (!a.name.trim()) errors.push(`Artifact ${i + 1} needs a name.`);
    if (!a.finding.trim()) errors.push(`"${n}" needs a finding summary. The patient and feedback rely on it.`);
    // File attachments are optional. Only an artifact explicitly marked
    // requireFile blocks publication; otherwise it is purely informational,
    // and the finding text is always shown to students regardless.
    if (!a.fileName) {
      if (a.requireFile) errors.push(`"${n}" is marked as requiring a file, but none is attached.`);
      else info.push(`"${n}" has no file attached. Students will see its finding text only.`);
    }
    const f = a.finding.toLowerCase();
    if (a.abnormal && /\bnormal\b|unremarkable|within normal/.test(f) && !/abnormal/.test(f))
      warnings.push(`"${n}" is marked abnormal, but its finding reads as normal.`);
    if (!a.abnormal && /elevat|depress|abnormal|infiltrate|fracture|mass|effusion|occlu/.test(f))
      warnings.push(`"${n}" is not marked abnormal, but its finding describes an abnormality.`);
  });

  // --- Medication/condition consistency ---
  // There is no separate "history" section anymore: the full case lives in the
  // main case text, plus any structured facts. So we check medications against
  // ALL available clinical text (every fact + the pasted case text), not a
  // specific history tab.
  const medsText = p.facts
    .filter(f => f.tab === "meds" && !/allerg/i.test(f.label))
    .map(f => (f.label + " " + f.value).toLowerCase())
    .join(" ");
  const caseText = (
    p.facts.map(f => f.label + " " + f.value).join(" ") + " " + (p.caseText || "")
  ).toLowerCase();
  const rules = [
    [/statin/, /cholesterol|lipid|coronary|cardiovascular|heart|stroke/, "a statin is listed, but no matching condition (cholesterol or heart disease) appears in the case"],
    [/pril|sartan|amlodipine|metoprolol|hydrochlorothiazide/, /hypertension|blood pressure|heart failure|kidney|heart|angina/, "a blood pressure medicine is listed, but no matching condition appears in the case"],
    [/metformin|insulin|glipizide/, /diabet/, "a diabetes medicine is listed, but diabetes is not in the case"],
    [/levothyroxine/, /thyroid/, "levothyroxine is listed, but thyroid disease is not in the case"],
    [/inhaler|albuterol|salbutamol/, /asthma|copd|emphysema|bronch/, "an inhaler is listed, but no lung condition appears in the case"]
  ];
  rules.forEach(([drug, cond, msg]) => { if (drug.test(medsText) && !cond.test(caseText)) warnings.push("Consistency: " + msg + "."); });

  if (!p.facts.some(f => /allerg/i.test(f.label))) warnings.push("No allergies recorded. If there are none, add a fact saying \"No known allergies\".");
  if (!p.facts.some(f => f.key)) warnings.push("No facts are marked as key findings, so feedback cannot score what the student missed.");
  if (!p.sources.length) info.push("No knowledge sources attached. The patient will rely only on the facts above.");

  // --- Assessment criteria: validated only WHEN present; never blocks. ---
  const criteria = assessment(p).criteria;
  if (!criteria.some(c => (c.name || "").trim())) {
    info.push("No assessment criteria added. Publishing is allowed; student feedback will not be scored against criteria.");
  } else {
    let weightSum = 0, haveWeights = false, badWeights = false;
    criteria.forEach((c, i) => {
      const n = (c.name || "").trim() || ("Criterion " + (i + 1));
      const raw = String(c.weight ?? "").trim();
      if (raw === "") return;                 // weights are optional
      const num = Number(raw);
      if (!isFinite(num) || num < 0) {
        warnings.push(`Assessment: the weight for "${n}" ("${raw}") is not a valid non-negative number.`);
        badWeights = true;
      } else {
        haveWeights = true;
        weightSum += num;
      }
    });
    if (haveWeights && !badWeights && Math.abs(weightSum - 100) > 0.01) {
      warnings.push(`Assessment: the grading weights add up to ${Math.round(weightSum * 100) / 100}, not 100. Adjust them if you intend percentages.`);
    }
  }

  return { errors, warnings, info };
}

function showResults(r, published) {
  resultsBox.textContent = "";
  const bad = r.errors.length > 0;
  const box = h("div", { class: "res " + (bad ? "bad" : "good"), role: "status" });
  if (bad) {
    box.append(h("h3", {}, "Cannot publish yet"));
    box.append(h("p", {}, h("span", { class: "must" }, "Must fix:")));
    box.append(h("ul", {}, r.errors.map(m => h("li", {}, m))));
  } else {
    box.append(h("h3", {}, published ? "Published. Students can now run this patient." : "No blocking problems found."));
  }
  if (r.warnings.length) {
    box.append(h("p", {}, h("span", { class: "warn" }, "Worth a look:")));
    box.append(h("ul", {}, r.warnings.map(m => h("li", {}, m))));
  } else if (!bad) {
    box.append(h("p", {}, "Everything is consistent."));
  }
  // Informational messages: never block, never a "problem" \u2014 just FYI.
  if (r.info && r.info.length) {
    box.append(h("p", {}, h("span", { class: "info-label" }, "For your information:")));
    box.append(h("ul", {}, r.info.map(m => h("li", {}, m))));
  }
  resultsBox.append(box);
  resultsBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* =====================================================================
   9. EXPORT & PUBLISH
   publish() runs the checks and flips status; the *ForExport helpers shape
   the additive, backward-compatible encounter JSON; toEncounterProfile
   assembles it and download() saves it.
   ===================================================================== */
function publish() {
  const p = current();
  const r = runChecks(p);
  if (!r.errors.length) { p.status = "published"; save(); updatePill(); renderSidebar(); }
  showResults(r, !r.errors.length);
}

/* Turn the temperament fields into a clean object for export. "Custom" dropdown
   choices resolve to the typed custom text. Returns null when nothing is filled
   in, so an empty temperament adds nothing to the JSON (backward-compatible). */
function temperamentForExport(p) {
  const t = temp(p);
  const resolve = (val, customVal) => val === "Custom" ? (customVal || "").trim() : (val || "").trim();
  const out = {
    temperament: resolve(t.temperament, t.temperamentCustom),
    communicationStyle: resolve(t.commStyle, t.commStyleCustom),
    emotionalCues: (t.cues || "").trim(),
    triggers: (t.triggers || "").trim(),
    empathyResponse: (t.empathyResponse || "").trim(),
    progression: (t.progression || "").trim(),
    facultyNotes: (t.notes || "").trim()
  };
  return Object.values(out).some(v => v) ? out : null;
}

/* Turn the student profile into a clean object for export. "Other / Custom"
   choices resolve to the typed custom text. Returns null when nothing is filled
   in, so an empty profile adds nothing to the JSON (backward-compatible). */
function studentProfileForExport(p) {
  const s = studentProfile(p);
  const specialty = s.specialty === "Other / Custom" ? (s.specialtyCustom || "").trim() : (s.specialty || "").trim();
  const out = {
    year: (s.year || "").trim(),                                   // "M1".."M4"
    yearLabel: YEAR_CONFIG[s.year] ? YEAR_CONFIG[s.year].label : "",
    specialty,
    expectedLevel: (s.expectedLevel || "").trim()
  };
  return Object.values(out).some(v => v) ? out : null;
}

/* The official year rubric as a plain object for export/reference. Returns null
   when no M1-M4 year is selected. This is additive and reference-only: nothing
   in the project grades against it automatically. */
function rubricForExport(p) {
  const yearKey = studentProfile(p).year;
  const cfg = YEAR_CONFIG[yearKey];
  if (!cfg) return null;
  return {
    year: yearKey,
    label: cfg.label,
    note: "Reference rubric for faculty discussion. The total is not an automatic pass/fail grade; a rating of 1 in professionalism, safety, and closure or clinical reasoning and synthesis should trigger review.",
    ratingScale: RATING_SCALE.map(s => ({ score: s.score, label: s.label })),
    expectations: cfg.expectations.slice(),
    domains: RUBRIC_DOMAINS.map(d => ({ key: d.key, name: d.name, mode: cfg.domainModes[d.key] || "core" })),
    maxTotal: cfg.maxTotal,
    epas: cfg.epas.map(e => ({ id: e.id, name: e.name, level: e.level, supervision: e.supervision })),
    patientDifficulty: cfg.patientDifficulty.slice()
  };
}

/* The Pediatrics rubric as a plain object for export. Used only when Specialty
   = Pediatrics. This is an INFORMATIONAL guide: it carries the categories, their
   point values and what the rubric looks for \u2014 no scores, totals or percentages,
   because this page does not implement scoring. */
function pedsRubricForExport() {
  return {
    type: "pediatrics",
    title: PEDS_RUBRIC.title,
    maxTotal: PEDS_RUBRIC.maxTotal,
    note: "Informational Pediatrics rubric. Point values show relative emphasis only; this page does not implement scoring.",
    criteria: PEDS_RUBRIC.criteria.map(c => ({ id: c.id, name: c.name, points: c.max, lookFor: c.points.slice() }))
  };
}

/* Turn the assessment criteria into a clean object for export. Empty criteria
   (no name and no description) are dropped. Weight is exported as a number when
   it is a valid non-negative value, otherwise omitted. Returns null when there
   is nothing to export, keeping the JSON backward-compatible. */
function assessmentForExport(p) {
  const a = assessment(p);
  const criteria = a.criteria
    .filter(c => (c.name || "").trim() || (c.description || "").trim())
    .map(c => {
      const out = { name: (c.name || "").trim(), description: (c.description || "").trim() };
      const w = String(c.weight ?? "").trim();
      if (w !== "" && isFinite(Number(w)) && Number(w) >= 0) out.weight = Number(w);
      if ((c.scale || "").trim()) out.scale = (c.scale || "").trim();
      if ((c.notes || "").trim()) out.notes = (c.notes || "").trim();
      return out;
    });
  const instructions = (a.instructions || "").trim();
  if (!instructions && !criteria.length) return null;
  const out = {};
  if (instructions) out.instructions = instructions;
  if (criteria.length) out.criteria = criteria;
  return out;
}

/* The file below is what the Encounter screen loads as its PATIENT object */
function toEncounterProfile(p) {
  const facts = [{ id: "demo", tab: "summary", label: "Patient", value: `${p.name}, ${p.age}-year-old ${p.sex.toLowerCase()}`, start: true }];
  // Release words are auto-derived from the label/name so progressive disclosure
  // keeps working now that faculty no longer type them.
  p.facts.forEach(f => facts.push({ id: f.id, tab: f.tab, label: f.label, value: f.value, key: f.key, triggers: deriveTriggers(f.label, f.triggers) }));
  p.artifacts.forEach(a => facts.push({
    id: a.id, tab: a.type === "Lab report" ? "labs" : "artifacts", label: a.name, value: a.finding,
    flag: a.abnormal ? "Abnormal" : undefined, artifact: a.type === "ECG" ? "ecg" : undefined, fileName: a.fileName || undefined,
    triggers: deriveTriggers(a.name, a.triggers)
  }));
  const profile = {
    name: p.name, age: Number(p.age), sex: p.sex, greeting: p.greeting,
    caseText: p.caseText || "",
    fallback: "I'm not sure what you mean. Could you ask me another way?",
    tabs: [{ id: "summary", label: "Summary" }, { id: "history", label: "History" }, { id: "meds", label: "Meds & allergies" },
           { id: "labs", label: "Labs" }, { id: "artifacts", label: "ECG & imaging" }, { id: "log", label: "Disclosure log" }],
    facts, objectives: assessment(p).criteria.map(c => (c.name || "").trim()).filter(Boolean), sources: p.sources.map(s => ({ title: s.title, note: s.note }))
  };
  const behaviour = temperamentForExport(p);
  if (behaviour) profile.temperament = behaviour;   // additive: only present when filled in
  const learner = studentProfileForExport(p);
  if (learner) profile.studentProfile = learner;    // additive: learner metadata for faculty reference
  const grading = assessmentForExport(p);
  if (grading) profile.assessment = grading;        // additive: grading criteria stored for faculty reference
  // Exactly one rubric is exported, mirroring what the UI shows: the informational
  // Pediatrics rubric when Specialty = Pediatrics, otherwise the general M1-M4
  // rubric. Never both.
  if (studentProfile(p).specialty === PEDS_SPECIALTY) {
    profile.rubric = pedsRubricForExport();          // additive: informational Pediatrics rubric
  } else {
    const rubric = rubricForExport(p);
    if (rubric) profile.rubric = rubric;             // additive: official year rubric for reference
  }
  return profile;
}
function download() {
  const p = current();
  const blob = new Blob([JSON.stringify(toEncounterProfile(p), null, 2)], { type: "application/json" });
  const a = h("a", { href: URL.createObjectURL(blob), download: (p.name || "patient").toLowerCase().replace(/\s+/g, "-") + ".json" });
  document.body.append(a); a.click(); a.remove();
}

/* =====================================================================
   10. AI EXTRACTION (frontend side)
   Sends the pasted case text to the LOCAL server, then shows a preview so
   faculty can review before anything is applied. Nothing here saves,
   publishes, or runs the consistency checks automatically.
   ===================================================================== */
async function runAiExtraction(p, caseArea, aiBtn, aiStatus, previewBox) {
  const text = (caseArea.value || "").trim();
  previewBox.textContent = "";
  aiStatus.className = "ai-status";

  if (!text) {
    aiStatus.className = "ai-status err";
    aiStatus.textContent = "Paste a clinical case above first.";
    return;
  }

  // Loading state
  aiBtn.disabled = true;
  aiStatus.textContent = "";
  aiStatus.append(h("span", { class: "spinner" }), " Reading the case with AI\u2026");

  try {
    const resp = await fetch(AI_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ caseText: text })
    });

    let data = null;
    try { data = await resp.json(); } catch (e) { /* non-JSON response handled below */ }

    if (!resp.ok) {
      const msg = (data && data.error) ? data.error : ("Server returned " + resp.status + ".");
      throw new Error(msg);
    }
    if (!data || !data.result) {
      throw new Error("The AI response was empty or malformed. Nothing was changed.");
    }

    aiStatus.className = "ai-status";
    aiStatus.textContent = "Draft ready. Review the suggestions below before applying.";
    renderExtractionPreview(p, data.result, previewBox, aiStatus);
  } catch (err) {
    aiStatus.className = "ai-status err";
    const net = (err instanceof TypeError);  // fetch network/CORS failure
    aiStatus.textContent = net
      ? "Could not reach the AI server. Is it running at " + AI_ENDPOINT + "? Nothing was changed."
      : ("AI extraction failed: " + err.message);
  } finally {
    aiBtn.disabled = false;
  }
}

/* Build the review panel. Shows every suggested value, flags conflicts with
   fields faculty already filled, lists what the AI could NOT find, and only
   changes the patient when faculty clicks Apply. */
function renderExtractionPreview(p, r, previewBox, aiStatus) {
  previewBox.textContent = "";
  const box = h("div", { class: "preview" });
  box.append(h("h3", {}, "AI draft \u2014 review before applying"));

  // Scalar fields: only offered if the AI found something.
  const scalarDefs = [
    ["title", "Case title", p.title],
    ["name", "Patient name", p.name],
    ["age", "Age", String(p.age ?? "")],
    ["sex", "Sex", p.sex]
  ];
  const scalars = scalarDefs.filter(([k]) => (r[k] ?? "").toString().trim());
  if (scalars.length) {
    const ul = h("ul", {});
    scalars.forEach(([k, label, existing]) => {
      const incoming = (r[k] ?? "").toString();
      const hasExisting = existing && existing.toString().trim() &&
        !(k === "greeting" && existing === "Hello, thanks for seeing me.");
      const conflict = hasExisting && existing.toString().trim() !== incoming.trim();
      ul.append(h("li", {},
        h("b", {}, label + ": "), incoming,
        conflict ? h("span", { class: "conflict" }, "  (you already have \u201c" + existing + "\u201d, which will be kept)") : null));
    });
    box.append(h("div", { class: "pv-sec" }, h("b", {}, "Patient details"), ul));
  }

  const countLine = (label, n) => h("div", { class: "pv-sec" }, h("b", {}, label), String(n) + " suggested");
  if (r.objectives && r.objectives.length) box.append(countLine("Learning objectives", r.objectives.length));
  if (r.facts && r.facts.length) box.append(countLine("Clinical facts", r.facts.length));
  if (r.artifacts && r.artifacts.length) box.append(countLine("Clinical artifacts", r.artifacts.length));
  if (r.sources && r.sources.length) box.append(countLine("Knowledge sources", r.sources.length));

  // Temperament: only shown when the AI found behaviour explicitly in the text.
  if (r.temperament && TEMPERAMENT_AI_MAP.some(m => (r.temperament[m.ai] ?? "").toString().trim())) {
    const tcur = temp(p);
    const ul = h("ul", {});
    TEMPERAMENT_AI_MAP.forEach(m => {
      const incoming = (r.temperament[m.ai] ?? "").toString().trim();
      if (!incoming) return;
      // what the faculty already has for this field (resolving a Custom dropdown)
      const existing = (m.custom && tcur[m.key] === "Custom")
        ? (tcur[m.custom] || "").trim()
        : (tcur[m.key] || "").trim();
      const conflict = existing && existing !== incoming;
      ul.append(h("li", {},
        h("b", {}, m.label + ": "), incoming,
        conflict ? h("span", { class: "conflict" }, "  (you already have \u201c" + existing + "\u201d, which will be kept)") : null));
    });
    box.append(h("div", { class: "pv-sec" }, h("b", {}, "Temperament & communication (from the text)"), ul));
  }

  if (r.assumptions && r.assumptions.length) {
    box.append(h("div", { class: "pv-sec" }, h("b", {}, "AI assumptions (not stated verbatim)"),
      h("ul", {}, r.assumptions.map(m => h("li", {}, m)))));
  }
  if (r.missing && r.missing.length) {
    box.append(h("div", { class: "missing" },
      h("b", {}, "Not found in the case \u2014 add manually if needed:"),
      h("ul", {}, r.missing.map(m => h("li", {}, m)))));
  }

  // How to handle lists: add alongside existing, or replace existing.
  const hasLists = (p.facts.length || p.artifacts.length || assessment(p).criteria.some(c => (c.name || "").trim()) || p.sources.length);
  const modeNote = h("p", { class: "hint" },
    hasLists
      ? "You already have some facts/objectives. \u201cAdd\u201d keeps yours and appends the AI ones. \u201cReplace\u201d clears yours first."
      : "Applying will fill the empty fields below. You can still edit everything afterwards.");

  const apply = (mode) => {
    applyExtraction(p, r, mode);
    aiStatus.className = "ai-status";
    aiStatus.textContent = "Applied. Review and edit the fields below, then Check consistency and Publish when ready.";
    previewBox.textContent = "";
    renderEditor();              // redraw so the populated fields show
    window.scrollTo(0, 0);
  };

  const actions = h("div", { class: "pv-actions" },
    h("button", { class: "btn", type: "button", onclick: () => apply("add") },
      hasLists ? "Apply (add to existing)" : "Apply to fields"),
    hasLists ? h("button", { class: "btn ghost", type: "button", onclick: () => apply("replace") }, "Apply (replace existing)") : null,
    h("button", { class: "btn ghost", type: "button", onclick: () => { previewBox.textContent = ""; aiStatus.textContent = "Discarded the AI draft. Nothing changed."; } }, "Discard")
  );

  box.append(modeNote, actions);
  previewBox.append(box);
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* Actually copy the reviewed values onto the patient object. Scalar fields are
   only filled if currently empty (never silently overwritten); the preview
   already warned about any conflicts, and for scalars we keep faculty text. */
function applyExtraction(p, r, mode) {
  const isDefaultGreeting = (v) => !v || v === "Hello, thanks for seeing me.";
  const setIfEmpty = (key, val, emptyTest) => {
    val = (val ?? "").toString().trim();
    if (!val) return;
    const cur = (p[key] ?? "").toString().trim();
    if ((emptyTest ? emptyTest(cur) : !cur)) p[key] = val;
  };
  setIfEmpty("title", r.title, (c) => !c || c === "Untitled case");
  setIfEmpty("name", r.name);
  setIfEmpty("age", r.age);
  // "Female" is the blank-patient default, so treat it as "not chosen yet".
  if (r.sex && ["Female", "Male", "Other"].includes(r.sex) && (!p.sex || p.sex === "Female")) {
    p.sex = r.sex;
  }
  setIfEmpty("greeting", r.greeting, isDefaultGreeting);

  // Learning objectives now live as assessment criteria, so AI-suggested
  // objectives become criteria rows (the objective text is the criterion name).
  const incomingObjectives = (r.objectives || []).filter(o => o && o.trim());
  const incomingCriteria = incomingObjectives.map(o => { const c = blankCriterion(o.trim()); c.aiReview = true; return c; });
  const incomingFacts = (r.facts || []).map(f => ({
    id: uid(), tab: f.tab, label: f.label || "", value: f.value || "",
    triggers: f.triggers || [], key: !!f.key, aiReview: true
  }));
  const incomingArtifacts = (r.artifacts || []).map(a => ({
    id: uid(), name: a.name || "", type: a.type || "Other", fileName: "",
    finding: a.finding || "", abnormal: !!a.abnormal, triggers: a.triggers || [], aiReview: true
  }));
  const incomingSources = (r.sources || []).map(s => ({
    id: uid(), title: s.title || "", note: s.note || "", fileName: "", aiReview: true
  }));

  const asmt = assessment(p);   // ensures the criteria array exists (and migrates any legacy objectives)
  if (mode === "replace") {
    if (incomingCriteria.length) asmt.criteria = incomingCriteria.slice();
    if (incomingFacts.length) p.facts = incomingFacts;
    if (incomingArtifacts.length) p.artifacts = incomingArtifacts;
    if (incomingSources.length) p.sources = incomingSources;
  } else {
    // add: keep existing criteria, append the AI-suggested ones
    asmt.criteria = asmt.criteria.concat(incomingCriteria);
    p.facts = p.facts.concat(incomingFacts);
    p.artifacts = p.artifacts.concat(incomingArtifacts);
    p.sources = p.sources.concat(incomingSources);
  }

  // Temperament: only fill fields the faculty hasn't set. Never overwrite.
  // Dropdown values from the AI are already clamped to valid options server-side.
  if (r.temperament) {
    const t = temp(p);
    let touched = false;
    TEMPERAMENT_AI_MAP.forEach(m => {
      const incoming = (r.temperament[m.ai] ?? "").toString().trim();
      if (!incoming) return;
      if (m.options) {
        // dropdown field: fill only if currently unset
        if (!t[m.key]) {
          if (m.options.includes(incoming)) { t[m.key] = incoming; touched = true; }
          else { t[m.key] = "Custom"; t[m.custom] = incoming; touched = true; }  // value not in list -> Custom
        }
      } else {
        // free-text field: fill only if empty
        if (!(t[m.key] || "").trim()) { t[m.key] = incoming; touched = true; }
      }
    });
    if (touched) t.aiReview = true;   // flag the section for faculty review
  }

  p.status = "draft";   // AI never publishes; always back to draft for review
  save();
}

/* Build the read-only panel that shows the selected year's expectations,
   domain modes, EPA targets and patient difficulty. Returns an empty node when
   no M1-M4 year is selected. This is the official rubric view; it is derived
   from YEAR_CONFIG and never edited directly by faculty. */
function renderYearRubric(yearKey) {
  const cfg = YEAR_CONFIG[yearKey];
  if (!cfg) {
    return h("p", { class: "hint" },
      "Choose a medical student year (M1\u2013M4) to load the year-appropriate expectations, scoring modes, EPA targets and patient difficulty.");
  }
  const box = h("div", { class: "rubric" });

  box.append(h("h4", {}, "Expected performance \u2014 " + cfg.label));
  box.append(h("ul", { class: "exp" }, cfg.expectations.map(e => h("li", {}, e))));

  // Domain table: name + mode. "na" rows are clearly excluded from the total.
  const rows = RUBRIC_DOMAINS.map(d => {
    const mode = cfg.domainModes[d.key] || "core";
    return h("tr", {},
      h("td", {}, d.name),
      h("td", {}, h("span", { class: "mode " + mode, title: DOMAIN_MODES[mode] },
        mode === "na" ? "N/A" : (mode.charAt(0).toUpperCase() + mode.slice(1)))));
  });
  box.append(h("table", {},
    h("thead", {}, h("tr", {}, h("th", {}, "Assessment domain"), h("th", {}, "Mode this year"))),
    h("tbody", {}, rows)));

  box.append(h("div", { class: "scalekey" },
    RATING_SCALE.map(s => h("span", {}, s.score + " \u2014 " + s.label))));

  box.append(h("p", { class: "hint", style: "margin:10px 0 0" },
    "Maximum total this year: " + cfg.maxTotal + " points (N/A domains are excluded, never counted as zero). " +
    "The total is a discussion aid, not an automatic pass/fail grade."));

  // EPA targets
  box.append(h("h4", { style: "margin-top:12px" }, "EPA targets"));
  box.append(h("ul", { class: "epa" }, cfg.epas.map(e =>
    h("li", {}, h("b", {}, e.id + " \u2014 "), e.name + ": " + e.level + ", " + e.supervision))));

  // Patient difficulty guidance
  box.append(h("h4", { style: "margin-top:12px" }, "Patient difficulty guidance"));
  box.append(h("ul", { class: "epa" }, cfg.patientDifficulty.map(d => h("li", {}, d))));

  const reviewNames = REVIEW_TRIGGER_DOMAINS
    .map(k => (RUBRIC_DOMAINS.find(d => d.key === k) || {}).name)
    .filter(Boolean).join(" or ");
  box.append(h("p", { class: "reviewnote" },
    "A rating of 1 in " + reviewNames + " should trigger review even if the overall total is high."));

  return box;
}

/* Build the INFORMATIONAL Pediatrics rubric guide. Shown ONLY when Specialty =
   "Pediatrics". This is a read-only reference: it lists the four categories and
   their original point values so users understand the relative emphasis, plus
   what the rubric looks for in each. There is intentionally NO scoring here \u2014
   no inputs, no earned points, no totals, no percentages, no pass/fail. */
function renderPedsRubric() {
  const box = h("div", { class: "rubric" });
  box.append(h("h4", {}, PEDS_RUBRIC.title));
  box.append(h("p", { class: "hint", style: "margin:0 0 10px" },
    "Informational guide only. The point values show the relative emphasis of each category; this page is for reviewing assessment expectations, not for entering scores."));

  PEDS_RUBRIC.criteria.forEach((c, idx) => {
    box.append(h("div", { class: "sub" },
      h("div", { class: "row-end" },
        h("span", {}, h("b", {}, (idx + 1) + ". " + c.name)),
        h("span", { class: "filename" }, c.max + " points")),
      h("div", {}, h("b", { style: "font-size:13px" }, "What the rubric looks for:")),
      h("ul", { class: "exp", style: "margin:4px 0 0" }, c.points.map(pt => h("li", {}, pt)))));
  });

  return box;
}

/* =====================================================================
   PRESET PATIENT PICKER
   Shows the built-in preset library in a modal with search. Choosing one
   creates a NEW independent draft (fresh id) populated only from fields the
   source actually provides, and tracks the source dataset + record id.
   ===================================================================== */

/* Does the current patient have unsaved-looking edits worth confirming before
   we replace the view with a freshly created preset draft? We treat a case the
   faculty has started filling in (title/name/caseText/facts/artifacts) as
   worth a confirm; a pristine blank case is not. */
function currentHasContent() {
  const p = current();
  if (!p) return false;
  if ((p.title || "").trim() && p.title.trim() !== "Untitled case") return true;
  if ((p.name || "").trim()) return true;
  if ((p.caseText || "").trim()) return true;
  if ((p.facts || []).length) return true;
  if ((p.artifacts || []).length) return true;
  return false;
}

/* Create a brand-new independent draft from a preset and make it current.
   Populates only supported fields; never mutates the preset or other cases. */
function applyPreset(preset) {
  const p = blankPatient();                         // fresh id + empty objectives
  // Deep-copy any structured source data so edits never touch PRESET_DATA.
  const src = JSON.parse(JSON.stringify(preset));
  p.title = (src.name ? src.name + " \u2014 preset case" : "Preset case");
  if (src.name) p.name = src.name;
  if (typeof src.age === "number") p.age = src.age;
  if (src.sex === "Male" || src.sex === "Female") p.sex = src.sex;   // model only has M/F/Other
  if ((src.caseText || "").trim()) p.caseText = src.caseText;
  // Clinical artifacts: only the lab entries the source actually provided.
  p.artifacts = (src.artifacts || []).map(a => ({
    id: uid(), name: a.name || "", type: a.type || "Lab report", fileName: "",
    finding: a.finding || "", abnormal: !!a.abnormal, triggers: []
  }));
  // Temperament & communication: mapped from the source psychosocial profile.
  // Source values are free text, so dropdowns are set to "Custom" with the text
  // in the matching custom field. temp(p) guarantees a complete object first;
  // we only overwrite keys the source actually provides (no invention).
  if (src.temperament && typeof src.temperament === "object") {
    const t = temp(p);
    const st = src.temperament;
    const setStr = (k) => { if ((st[k] || "").toString().trim()) t[k] = st[k]; };
    // Dropdowns: accept a known option, else fall back to Custom + custom text.
    if ((st.temperament || "").trim()) {
      t.temperament = TEMPERAMENT_OPTIONS.includes(st.temperament) ? st.temperament : "Custom";
      if (t.temperament === "Custom") t.temperamentCustom = (st.temperamentCustom || st.temperament || "").trim();
    }
    if ((st.commStyle || "").trim()) {
      t.commStyle = COMM_STYLE_OPTIONS.includes(st.commStyle) ? st.commStyle : "Custom";
      if (t.commStyle === "Custom") t.commStyleCustom = (st.commStyleCustom || st.commStyle || "").trim();
    }
    setStr("cues"); setStr("triggers"); setStr("empathyResponse"); setStr("progression"); setStr("notes");
  }
  // Provenance: track where this draft came from (shown nowhere sensitive).
  p.source = {
    dataset: (PRESET_DATA.source && PRESET_DATA.source.dataset) || "",
    recordId: src.sourceRecordId,
    license: (PRESET_DATA.source && PRESET_DATA.source.license) || ""
  };
  p.status = "draft";
  db.patients.push(p);
  db.currentId = p.id;
  save();
  renderAll();
}

/* The modal picker. Loading/empty/error states are handled defensively so a
   malformed PRESET_DATA can never crash the editor. */
function openPresetPicker() {
  // Error / empty state guards.
  let list = [];
  try {
    list = (PRESET_DATA && Array.isArray(PRESET_DATA.patients)) ? PRESET_DATA.patients.slice() : [];
  } catch (e) { list = []; }

  const overlay = h("div", { class: "modal-overlay" });
  const close = () => overlay.remove();
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });

  const panel = h("div", { class: "modal" });
  const header = h("div", { class: "modal-head" },
    h("h3", {}, "Choose a Preset Patient"),
    h("button", { class: "btn ghost small", type: "button", onclick: close }, "Close"));

  const srcNote = h("p", { class: "hint", style: "margin:0 0 10px" },
    (PRESET_DATA.source
      ? "Synthetic cases from " + PRESET_DATA.source.dataset + " (" + PRESET_DATA.source.license + "). No real patients."
      : "Built-in preset cases."));

  const grid = h("div", { class: "preset-grid" });
  const empty = h("p", { class: "hint" });

  const card = (preset) => {
    const meta = [];
    if (typeof preset.age === "number") meta.push("Age " + preset.age);
    if (preset.sex) meta.push(preset.sex);
    if (preset.category) meta.push(preset.category);
    return h("div", { class: "preset-card" },
      h("b", {}, preset.name || "Unnamed preset"),
      meta.length ? h("div", { class: "preset-meta" }, meta.join(" \u00b7 ")) : null,
      preset.summary ? h("p", { class: "preset-sum" }, preset.summary.length > 220 ? preset.summary.slice(0, 220) + "\u2026" : preset.summary) : null,
      h("button", { class: "btn small", type: "button", onclick: () => {
        if (currentHasContent() &&
            !confirm("Replace the current case view with a new draft from \"" + (preset.name || "this preset") + "\"? Your current case stays saved in the library.")) return;
        applyPreset(preset);
        close();
      } }, "Use This Patient"));
  };

  const draw = (q) => {
    grid.textContent = ""; empty.textContent = "";
    const needle = (q || "").trim().toLowerCase();
    const filtered = !needle ? list : list.filter(pr => {
      const hay = [pr.name, pr.sex, pr.category, pr.summary, (pr.keywords || []).join(" ")].join(" ").toLowerCase();
      return hay.includes(needle);
    });
    if (!list.length) { empty.textContent = "No preset patients are available."; return; }
    if (!filtered.length) { empty.textContent = "No presets match \u201c" + q + "\u201d."; return; }
    filtered.forEach(pr => grid.append(card(pr)));
  };

  const search = h("input", { type: "text", placeholder: "Search presets by name, category or keyword\u2026",
    "aria-label": "Search presets", oninput: (e) => draw(e.target.value) });

  const scratch = h("button", { class: "btn ghost", type: "button", onclick: () => {
    if (currentHasContent() &&
        !confirm("Start a new blank case? Your current case stays saved in the library.")) return;
    const p = blankPatient(); db.patients.push(p); db.currentId = p.id; save(); renderAll(); close();
  } }, "Start From Scratch");

  panel.append(header, srcNote, search, grid, empty,
    h("div", { style: "margin-top:12px;display:flex;justify-content:flex-end" }, scratch));
  overlay.append(panel);
  document.body.append(overlay);
  draw("");
  search.focus();
}

function renderEditor() {
  const p = current();
  const root = document.getElementById("editor");
  root.textContent = "";
  pill = h("span", { class: "pill" });
  resultsBox = h("div", { class: "results" });

  titleSpan = h("span", { class: "title" }, p.title || "Untitled case");
  root.append(h("div", { class: "bar" },
    titleSpan, pill,
    h("button", { class: "btn ghost", type: "button", onclick: () => showResults(runChecks(p), false) }, "Check consistency"),
    h("button", { class: "btn", type: "button", onclick: publish }, "Publish"),
    h("button", { class: "btn ghost", type: "button", onclick: download }, "Download for encounter")
  ));
  root.append(resultsBox);
  updatePill();

  /* 0. Patient Case Information (main way to enter a case) */
  // Small helper: a titled subsection block that lives INSIDE a top-level card.
  const subsection = (title, hint, ...nodes) =>
    h("div", { class: "subsection" },
      h("h3", {}, title),
      hint ? h("p", { class: "hint" }, hint) : null,
      ...nodes);

  /* =====================================================================
     SECTION A: MEDICAL STUDENT PROFILE
     Year (M1-M4) + specialty + the official year rubric + Assessment Criteria.
     ===================================================================== */
  const sp = studentProfile(p);

  // --- A1. Year, specialty, and the live year-appropriate rubric ---
  const rubricPanel = h("div", {});
  // Specialty decides which rubric shows: Pediatrics -> informational Pediatrics
  // rubric guide; anything else -> the general M1-M4 rubric. Only one is ever
  // shown. Neither displays or stores scores.
  const drawRubricPanel = () => {
    rubricPanel.textContent = "";
    rubricPanel.append(sp.specialty === PEDS_SPECIALTY
      ? renderPedsRubric()
      : renderYearRubric(sp.year));
  };

  const profileBox = h("div", {});
  const drawProfile = () => {
    profileBox.textContent = "";
    // Specialty keeps its "Other / Custom" reveal. Changing specialty must
    // immediately swap the rubric panel (and re-draw the Assessment Criteria
    // note, which mentions the year rubric).
    const specialtyWrap = h("div", {});
    specialtyWrap.append(field("Specialty", selectInput(sp, "specialty", [""].concat(SPECIALTY_OPTIONS), () => { drawRubricPanel(); drawProfile(); })));
    if (sp.specialty === "Other / Custom") {
      specialtyWrap.append(h("div", { style: "margin-top:8px" },
        field("Custom specialty",
          h("input", { type: "text", value: sp.specialtyCustom ?? "", placeholder: "Enter the specialty",
            oninput: (e) => { sp.specialtyCustom = e.target.value; touch(); } }))));
    }
    profileBox.append(h("div", { class: "grid2" },
      field("Medical student year", selectInput(sp, "year", [""].concat(MED_YEAR_OPTIONS), () => { drawRubricPanel(); drawProfile(); })),
      specialtyWrap
    ));
  };
  drawProfile();

  // --- A2. Assessment Criteria (official year rubric + optional faculty objectives) ---
  const asmt = assessment(p);
  const asmtBox = h("div", {});
  const drawAssessment = () => {
    asmtBox.textContent = "";
    asmtBox.append(field("Overall assessment instructions (optional)",
      h("textarea", { rows: "3", value: asmt.instructions ?? "",
        placeholder: "Any overall note on how to assess this case (optional).",
        oninput: (e) => { asmt.instructions = e.target.value; touch(); } })));

    // Clearly separate the OFFICIAL rubric (shown above) from faculty objectives.
    asmtBox.append(h("p", { class: "hint", style: "margin:14px 0 4px" },
      h("b", {}, "Official rubric"),
      h("span", { class: "official-badge" }, "Read-only")));
    if (sp.specialty === PEDS_SPECIALTY) {
      asmtBox.append(h("p", { class: "hint", style: "margin:0 0 8px" },
        "Specialty is Pediatrics, so the " + PEDS_RUBRIC.title +
        " is shown above as an informational guide instead of the general rubric. This page does not score it."));
    } else {
      asmtBox.append(sp.year
        ? h("p", { class: "hint", style: "margin:0 0 8px" },
            "The seven domains, modes, maximum total and EPA targets above come from the selected year (" +
            sp.year + ") and update automatically when you change the year. They are stored with the scenario for reference.")
        : h("p", { class: "hint", style: "margin:0 0 8px" }, "Select a medical student year above to load the official rubric."));
    }

    asmtBox.append(h("p", { class: "hint", style: "margin:14px 0 4px" },
      h("b", {}, "Additional faculty objectives (optional)")));
    asmtBox.append(h("p", { class: "hint", style: "margin:0 0 8px" },
      "Scenario-specific objectives you want to track in addition to the official rubric. These do not change the year rubric or its maximum total."));

    const totalLine = h("p", { class: "hint", style: "margin:10px 0 4px" });
    const refreshTotal = () => {
      let sum = 0, bad = false, any = false;
      asmt.criteria.forEach(c => {
        const raw = String(c.weight ?? "").trim();
        if (raw === "") return;
        const num = Number(raw);
        if (!isFinite(num) || num < 0) { bad = true; } else { sum += num; any = true; }
      });
      if (bad) { totalLine.textContent = "Some weights are not valid non-negative numbers."; totalLine.style.color = "var(--alert)"; }
      else if (!any) { totalLine.textContent = "Weights are optional. If you use percentages, they should total 100."; totalLine.style.color = "var(--muted)"; }
      else if (Math.abs(sum - 100) > 0.01) { totalLine.textContent = "Weights total " + (Math.round(sum * 100) / 100) + " (not 100). You can still save."; totalLine.style.color = "var(--alert)"; }
      else { totalLine.textContent = "Weights total 100."; totalLine.style.color = "var(--ok)"; }
    };

    asmt.criteria.forEach((c, i) => {
      asmtBox.append(h("div", { class: "sub" },
        field("Objective / criterion name", textInput(c, "name")),
        field("Description of expected performance", textArea(c, "description", 2)),
        h("div", { class: "grid2" },
          field("Weight or percentage (optional)",
            h("input", { type: "text", inputmode: "decimal", value: c.weight ?? "", placeholder: "e.g. 25",
              oninput: (e) => { c.weight = e.target.value; touch(); refreshTotal(); } })),
          field("Scoring scale (optional)",
            h("input", { type: "text", value: c.scale ?? "", placeholder: "e.g. 0-4, Pass/Fail, 1-5",
              oninput: (e) => { c.scale = e.target.value; touch(); } }))),
        field("Notes for faculty (optional)", textArea(c, "notes", 2)),
        h("div", { class: "row-end" },
          h("span", {}),
          h("button", { class: "btn danger small", type: "button",
            onclick: () => { asmt.criteria.splice(i, 1); touch(); drawAssessment(); } }, "Remove objective"))));
    });
    if (!asmt.criteria.length) asmtBox.append(h("p", { class: "hint" }, "No extra objectives. The official year rubric still applies."));

    asmtBox.append(totalLine);
    refreshTotal();

    asmtBox.append(h("div", { style: "display:flex;gap:10px;flex-wrap:wrap;margin-top:4px" },
      h("button", { class: "btn ghost small", type: "button",
        onclick: () => { asmt.criteria.push(blankCriterion()); touch(); drawAssessment(); } }, "Add objective"),
      h("button", { class: "btn ghost small", type: "button",
        onclick: () => {
          if (asmt.criteria.length && !confirm("Add the suggested objectives to the ones you already have?")) return;
          SUGGESTED_CRITERIA.forEach(n => asmt.criteria.push(blankCriterion(n)));
          touch(); drawAssessment();
        } }, "Add suggested objectives")));
  };
  drawAssessment();

  drawRubricPanel();
  root.append(h("section", { class: "card" },
    h("h2", {}, "Medical Student Profile"),
    h("p", { class: "hint" }, "Choose the learner's year and specialty. The year sets the official assessment rubric, scoring modes, EPA targets and patient difficulty."),
    subsection("Student year and specialty",
      "Pick M1\u2013M4. Changing the year updates the rubric below. Your extra objectives are never erased.",
      profileBox, rubricPanel),
    subsection("Assessment Criteria",
      "The official year rubric (above) plus any scenario-specific objectives you add. Nothing here auto-grades \u2014 the criteria are saved for faculty reference and feedback discussion.",
      asmtBox)
  ));

  /* =====================================================================
     SECTION B: PATIENT CASE INFORMATION
     Main case text + AI, then Patient Basics, Temperament, Clinical Artifacts,
     Knowledge Sources. (The "Clinical Record & Release Rules" editing UI was
     removed; p.facts data is still populated by AI and used for disclosure.)
     ===================================================================== */

  // --- B0. Main case text + AI extraction ---
  const caseArea = h("textarea", {
    rows: "14",
    placeholder: "Paste the complete clinical case here: history, symptoms, exam findings, vitals, medications, allergies, investigations and results, diagnosis and plan. Line breaks are kept.",
    value: p.caseText ?? "",
    oninput: (e) => { p.caseText = e.target.value; touch(); }
  });
  const aiStatus = h("span", { class: "ai-status" });
  const previewBox = h("div", {});
  const aiBtn = h("button", {
    class: "btn ai", type: "button",
    onclick: () => runAiExtraction(p, caseArea, aiBtn, aiStatus, previewBox)
  }, "Fill Other Fields with AI");
  const presetBtn = h("button", {
    class: "btn ghost", type: "button", onclick: openPresetPicker
  }, "Choose a Preset Patient");

  // --- B1. Patient basics ---
  const basicsBox = h("div", {},
    h("div", { class: "grid2" },
      field("Case title", textInput(p, "title")),
      field("Patient name", textInput(p, "name"))),
    h("div", { class: "grid3", style: "margin-top:12px" },
      field("Age", textInput(p, "age", "number")),
      field("Sex", selectInput(p, "sex", ["Female", "Male", "Other"]))));

  // --- B2. Patient temperament & communication style ---
  const t = temp(p);
  const tempBox = h("div", {});
  const drawTemperament = () => {
    tempBox.textContent = "";
    const dropdownWithCustom = (label, key, customKey, options, customPlaceholder) => {
      const wrap = h("div", {});
      wrap.append(field(label, selectInput(t, key, [""].concat(options), () => drawTemperament())));
      if (t[key] === "Custom") {
        wrap.append(h("div", { style: "margin-top:8px" },
          field("Custom " + label.toLowerCase(),
            h("input", { type: "text", value: t[customKey] ?? "", placeholder: customPlaceholder,
              oninput: (e) => { t[customKey] = e.target.value; touch(); } }))));
      }
      return wrap;
    };
    tempBox.append(h("div", { class: "grid2" },
      dropdownWithCustom("Default temperament", "temperament", "temperamentCustom", TEMPERAMENT_OPTIONS, "Describe the temperament in your own words"),
      dropdownWithCustom("Communication style", "commStyle", "commStyleCustom", COMM_STYLE_OPTIONS, "Describe the communication style in your own words")
    ));
    const area = (label, key, placeholder) =>
      h("div", { style: "margin-top:12px" }, field(label,
        h("textarea", { rows: "3", value: t[key] ?? "", placeholder,
          oninput: (e) => { t[key] = e.target.value; touch(); } })));
    tempBox.append(
      area("Emotional cues and observable behaviours", "cues",
        "e.g. avoids eye contact, speaks softly, appears restless, becomes tearful"),
      area("Triggers and sensitive topics", "triggers",
        "e.g. feeling blamed, being rushed, questions about alcohol"),
      area("Response to empathy and reassurance", "empathyResponse",
        "e.g. opens up when the learner listens and validates concerns"),
      area("Behavioural progression during the encounter", "progression",
        "e.g. starts guarded, becomes calmer once trust builds"),
      area("Additional faculty instructions (optional)", "notes",
        "Any other behavioural details the simulated patient should follow")
    );
  };
  drawTemperament();

  // Note: the "Clinical Record & Release Rules" editing UI was removed. The
  // underlying p.facts data model is preserved: facts are still populated by AI
  // extraction and still power progressive disclosure in the encounter export.

  // --- B4. Clinical artifacts (release words auto-derived; no manual input) ---
  const artBox = h("div", {});
  const drawArtifacts = () => {
    artBox.textContent = "";
    p.artifacts.forEach((a, i) => {
      artBox.append(h("div", { class: "sub" },
        aiBadge(a),
        h("div", { class: "grid2" },
          field("Name", textInput(a, "name")),
          field("Type", selectInput(a, "type", ARTIFACT_TYPES))),
        field("Finding summary (must match the patient's history)", textArea(a, "finding", 2)),
        h("div", { class: "row-end" },
          checkbox(a, "abnormal", "Abnormal result"),
          fileAttach(a, "fileName", "Attach artifact file"),
          h("button", { class: "btn danger small", type: "button", onclick: () => { p.artifacts.splice(i, 1); touch(); drawArtifacts(); } }, "Remove artifact"))));
    });
    artBox.append(h("button", { class: "btn ghost small", type: "button", onclick: () => {
      p.artifacts.push({ id: uid(), name: "", type: "Lab report", fileName: "", finding: "", abnormal: false, triggers: [] }); touch(); drawArtifacts();
    } }, "Add artifact"));
  };
  drawArtifacts();

  // --- B5. Knowledge sources ---
  const srcBox = h("div", {});
  const drawSources = () => {
    srcBox.textContent = "";
    p.sources.forEach((s, i) => {
      srcBox.append(h("div", { class: "sub" },
        aiBadge(s),
        field("Title", textInput(s, "title")),
        field("How it should be used", textArea(s, "note", 2)),
        h("div", { class: "row-end" },
          fileAttach(s, "fileName", "Attach source file"),
          h("button", { class: "btn danger small", type: "button", onclick: () => { p.sources.splice(i, 1); touch(); drawSources(); } }, "Remove source"))));
    });
    srcBox.append(h("button", { class: "btn ghost small", type: "button", onclick: () => { p.sources.push({ id: uid(), title: "", note: "", fileName: "" }); touch(); drawSources(); } }, "Add knowledge source"));
  };
  drawSources();

  root.append(h("section", { class: "card" },
    h("h2", {}, "Patient Case Information"),
    h("p", { class: "hint" }, "Paste the full clinical case once, then let AI draft the structured fields for you to review. The AI never publishes and never overwrites your text without asking."),
    subsection("Full case text",
      "Paste a case, or load one from the built-in preset library.",
      h("div", { class: "ai-row", style: "margin-top:0;margin-bottom:10px" }, presetBtn),
      field("Paste the complete clinical case", caseArea),
      h("div", { class: "ai-row" }, aiBtn, aiStatus),
      previewBox),
    subsection("Patient Basics", "Who the student is about to meet.", basicsBox),
    subsection("Patient Temperament & Communication Style" + (t.aiReview ? "  (AI \u2014 review)" : ""),
      "How the virtual patient behaves and communicates. All fields optional.", tempBox),
    subsection("Clinical Artifacts",
      "Lab reports, ECGs, X-rays, CT scans or prior notes. Each appears when the student asks for it; release words are generated automatically from the name.",
      artBox),
    subsection("Knowledge Sources",
      "Papers, guidelines or protocols that ground the patient and the feedback.",
      srcBox)
  ));

  /* Library actions (toolbar-style, not a form section) */
  root.append(h("div", { style: "display:flex;gap:10px;flex-wrap:wrap;margin:4px 2px 0" },
    h("button", { class: "btn ghost", type: "button", onclick: () => {
      const copy = JSON.parse(JSON.stringify(p)); copy.id = uid(); copy.title = (p.title || "Untitled case") + " (copy)"; copy.status = "draft";
      db.patients.push(copy); db.currentId = copy.id; save(); renderAll();
    } }, "Duplicate patient"),
    h("button", { class: "btn danger", type: "button", onclick: () => {
      if (!confirm("Delete \"" + (p.title || "Untitled case") + "\"? This cannot be undone.")) return;
      db.patients = db.patients.filter(x => x.id !== p.id);
      if (!db.patients.length) db.patients.push(blankPatient());
      db.currentId = db.patients[0].id; save(); renderAll();
    } }, "Delete patient")));
}

function renderAll() { renderSidebar(); renderEditor(); window.scrollTo(0, 0); }

/* =====================================================================
   12. BOOTSTRAP
   Wire the "New patient" button, load saved data, and do the first render.
   ===================================================================== */
document.getElementById("newBtn").addEventListener("click", () => {
  const p = blankPatient(); db.patients.push(p); db.currentId = p.id; save(); renderAll();
});

load();
renderAll();
</script>
